[project]
name = "doctodeck"
version = "0.1.0"
description = "Upload a Markdown or PDF file, get a measured, cost-tracked flashcard deck (Gemini or Claude)."
readme = "README.md"
authors = [
    { name = "maleek004", email = "mubaraqabdulmaleek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
doctodeck = "doctodeck:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"  # every `async def test_...` runs on an event loop, no marker needed
asyncio_default_fixture_loop_scope = "function"  # a fresh event loop per test

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
