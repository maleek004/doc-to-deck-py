<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>doc-to-deck</title>
</head>
<body>
  <h1>doc-to-deck</h1>

  <!-- Panel 1 (Layer 1): upload a file, see its outline -->
  <section id="panel-parse">
    <h2>1. Upload a document</h2>
    <form id="parse-form">
      <input type="file" name="file" accept=".md,.markdown,.pdf" required>
      <button type="submit">Parse</button>
    </form>
    <p id="parse-status"></p>
    <table id="outline" hidden border="1" cellpadding="4">
      <thead>
        <tr><th>#</th><th>Level</th><th>Title</th><th>Words</th><th>Snippet</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Panel 2 (Layer 2): plan modules, then generate cards -->
  <section id="panel-generate" hidden>
    <h2>2. Plan and generate</h2>
    <p>
      <label>Provider <select id="provider"></select></label>
      <button id="plan-button" type="button">Plan modules</button>
    </p>
    <p id="plan-status"></p>
    <table id="modules" hidden border="1" cellpadding="4">
      <thead>
        <tr><th>Use</th><th>#</th><th>Title</th><th>Description</th><th>Est. cards</th><th>Sections</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="generate-controls" hidden>
      <label>Cards <input id="card-count" type="number" min="3" max="30" value="10"></label>
      <button id="generate-button" type="button">Generate cards</button>
    </p>
    <p id="generate-status"></p>
    <table id="cards" hidden border="1" cellpadding="4">
      <thead>
        <tr><th>#</th><th>Module</th><th>Front</th><th>Back</th><th>Quality</th><th>Flags</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <ul id="repairs"></ul>
  </section>

  <script>
    // What the server has told us so far. The server keeps nothing between calls,
    // so each step sends what the next one needs.
    let parsed = null; // from /api/parse
    let plan = null;   // from /api/plan

    const $ = (id) => document.getElementById(id);

    // POST JSON (or a form) and return [ok, status, body]. Error bodies are { error, message }.
    async function post(url, body) {
      const isForm = body instanceof FormData;
      const response = await fetch(url, {
        method: "POST",
        headers: isForm ? {} : { "Content-Type": "application/json" },
        body: isForm ? body : JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({ error: "SERVER_ERROR", message: response.statusText }));
      return [response.ok, response.status, data];
    }

    // Adds one row to a table body. textContent, never innerHTML: all of this text comes from an
    // uploaded file or a model, so it is untrusted and must never run as HTML.
    function addRow(tbody, values) {
      const row = tbody.insertRow();
      for (const value of values) row.insertCell().textContent = value;
      return row;
    }

    const usageText = (u) =>
      `${u.provider}/${u.model}: ${u.promptTokens} tokens in, ${u.completionTokens} out, ${u.latencyMs} ms` +
      (u.cached ? " (from the cache: no call made, figures are from the original call)" : "");

    function showRepairs(list) {
      $("repairs").replaceChildren(...list.map((text) => {
        const li = document.createElement("li");
        li.textContent = "Fixed: " + text;
        return li;
      }));
    }

    // ---------- Panel 1 ----------
    $("parse-form").addEventListener("submit", async (event) => {
      event.preventDefault(); // stay on this page instead of doing a full-page form post

      $("parse-status").textContent = "Parsing…";
      $("outline").hidden = true;
      $("outline").tBodies[0].replaceChildren();
      $("panel-generate").hidden = true;

      const [ok, status, body] = await post("/api/parse", new FormData($("parse-form")));
      if (!ok) {
        $("parse-status").textContent = `Error ${status} ${body.error}: ${body.message}`;
        return;
      }

      parsed = body;
      const doc = body.document;
      $("parse-status").textContent =
        `${body.fileName}: ${doc.pageCount} page(s), ${doc.wordCount} words, ${doc.sections.length} section(s).`;
      doc.sections.forEach((s, i) =>
        addRow($("outline").tBodies[0], [i, s.level, s.title, s.wordCount, s.snippet]));
      $("outline").hidden = false;

      resetPlan();
      $("panel-generate").hidden = false;
    });

    // ---------- Panel 2 ----------
    async function loadProviders() {
      const providers = await (await fetch("/api/providers")).json();
      $("provider").replaceChildren(...providers.map((p) => {
        const option = document.createElement("option");
        option.value = p.provider;
        option.textContent = `${p.provider} (${p.model})${p.isReal ? "" : " (no key needed)"}`;
        return option;
      }));
    }

    function resetPlan() {
      plan = null;
      for (const id of ["modules", "cards", "generate-controls"]) $(id).hidden = true;
      $("modules").tBodies[0].replaceChildren();
      $("cards").tBodies[0].replaceChildren();
      $("plan-status").textContent = $("generate-status").textContent = "";
      showRepairs([]);
    }

    $("plan-button").addEventListener("click", async () => {
      resetPlan();
      $("plan-status").textContent = "Planning…";

      const doc = parsed.document;
      const [ok, status, body] = await post("/api/plan", {
        provider: $("provider").value,
        sourceTitle: parsed.fileName,
        sections: doc.sections,
        wordCount: doc.wordCount,
        pageCount: doc.pageCount
      });
      if (!ok) {
        $("plan-status").textContent = `Error ${status} ${body.error}: ${body.message}`;
        return;
      }

      plan = body;
      $("plan-status").textContent = `${body.modules.length} module(s). ${usageText(body.usage)}.`;
      for (const m of body.modules) {
        const row = addRow($("modules").tBodies[0],
          ["", m.moduleIndex, m.title, m.description, m.estimatedCards, m.sectionIndices.join(", ")]);
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = true;
        box.dataset.moduleIndex = m.moduleIndex;
        row.cells[0].appendChild(box);
      }
      showRepairs(body.repairs);
      $("modules").hidden = $("generate-controls").hidden = false;
    });

    $("generate-button").addEventListener("click", async () => {
      const picked = [...$("modules").querySelectorAll("input[type=checkbox]:checked")]
        .map((box) => Number(box.dataset.moduleIndex));
      const modules = plan.modules.filter((m) => picked.includes(m.moduleIndex));

      $("cards").hidden = true;
      $("cards").tBodies[0].replaceChildren();
      $("generate-status").textContent = "Generating…";

      const [ok, status, body] = await post("/api/generate", {
        provider: $("provider").value,
        sourceTitle: parsed.fileName,
        sections: parsed.document.sections,
        cleanText: parsed.document.cleanText,
        modules,
        targetCardCount: Number($("card-count").value)
      });
      if (!ok) {
        $("generate-status").textContent = `Error ${status} ${body.error}: ${body.message}`;
        return;
      }

      const cut = body.truncated
        ? ` Note: only the first ${body.sentChars} of ${body.totalChars} characters were sent to the model.`
        : "";
      $("generate-status").textContent = `${body.cards.length} card(s). ${usageText(body.usage)}.${cut}`;
      body.cards.forEach((c, i) =>
        addRow($("cards").tBodies[0], [i + 1, c.moduleTitle, c.front, c.back, c.qualityScore, c.qualityFlags.join(", ")]));
      showRepairs(body.repairs);
      $("cards").hidden = false;
    });

    loadProviders();
  </script>
</body>
</html>
